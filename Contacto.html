<!-- Declara que el documento usa HTML5. -->
<!DOCTYPE html>
<html lang="es">
	<head>
		<!-- Codificación, vista adaptable y título de la pestaña -->
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SCRUMLY - Contacto</title>

		<!-- Íconos, tipografías y hojas de estilo de esta página -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="CSS/Contacto.css" />
		<link rel="stylesheet" href="CSS/menu.css" />
		<link rel="stylesheet" href="CSS/footer.css">
	</head>
	<body>
		
		<!-- Aviso de confirmación del formulario -->
		<div class="Aviso-Mensaje-Enviado" id="aviso-mensaje-enviado" role="status" aria-live="polite">
			<span class="Icono-Mensaje-Enviado">
				<i class="bi bi-check-lg" aria-hidden="true"></i>
			</span>
			<span>Mensaje enviado</span>
		</div>

		<!-- Barra superior con el logo, el nombre del sitio y el acceso al menú -->
		<div id="menu-container"></div>

			<!-- Contenido principal de la página de contacto -->
		<div class="Pagina-Contacto">
			<!-- Presentación de la sección y motivo para ponerse en contacto -->
			<section class="Seccion-Principal-Contacto" aria-labelledby="titulo-principal-contacto">
				<p class="Antetitulo-Contacto">SCRUMLY · CONTACTO</p>
				<h1 id="titulo-principal-contacto">Hablemos de <span>Scrumly.</span></h1>
				<p class="Descripcion-Principal-Contacto">¿Tenés alguna consulta, sugerencia o comentario sobre Scrumly? Compartí tus ideas y ayudanos a mejorar la experiencia de aprendizaje.</p>
			</section>

			<!-- Introducción y formulario para enviar consultas, sugerencias o comentarios -->
			<section class="Seccion-Formulario-Contacto" id="formulario-contacto" aria-labelledby="titulo-formulario-contacto">
				<!-- Mensaje introductorio junto al formulario -->
				<div class="Introduccion-Formulario-Contacto">
					<i class="bi bi-envelope" aria-hidden="true"></i>
					<h2 id="titulo-formulario-contacto">Contactanos</h2>
					<p>Tu mirada también forma parte del proyecto.</p>
				</div>

				<!-- Formulario con campos requeridos y validación nativa del navegador -->
				<form class="Formulario-Contacto" method="post">
					<!-- Datos de contacto y contenido del mensaje -->
					<div class="Campos-Contacto">
						<!-- Nombre de la persona que envía el mensaje -->
						<div class="Campo-Contacto">
							<label for="nombre-contacto">Nombre completo <span aria-hidden="true">*</span></label>
							<input id="nombre-contacto" name="nombre" type="text" autocomplete="name" required />
						</div>
						<!-- Correo para poder identificar el remitente -->
						<div class="Campo-Contacto">
							<label for="correo-contacto">Correo electrónico <span aria-hidden="true">*</span></label>
							<input id="correo-contacto" name="correo" type="email" autocomplete="email" required />
						</div>
						<!-- Motivo elegido para clasificar el contacto -->
						<div class="Campo-Contacto Campo-Contacto-Completo">
							<label for="motivo-contacto">Motivo del contacto <span aria-hidden="true">*</span></label>
							<select id="motivo-contacto" name="motivo" required>
								<option value="" selected disabled>Seleccioná un motivo</option>
								<option value="consulta">Consulta</option>
								<option value="sugerencia">Sugerencia</option>
								<option value="comentario">Comentario</option>
								<option value="otro">Otro</option>
							</select>
						</div>
						<!-- Texto libre con el mensaje de la persona -->
						<div class="Campo-Contacto Campo-Contacto-Completo">
							<label for="mensaje-contacto">Mensaje <span aria-hidden="true">*</span></label>
							<textarea id="mensaje-contacto" name="mensaje" required></textarea>
						</div>
					</div>
					<!-- Aclaración sobre los campos requeridos y botón de envío -->
					<p class="Nota-Campos-Contacto"><span aria-hidden="true">*</span> Campos obligatorios</p>
					<button class="Boton-Enviar-Contacto" type="submit"><i class="bi bi-send" aria-hidden="true"></i>Enviar mensaje</button>
				</form>
			</section>
		</div>

        <!-- Sección pie -->
		<div id="footer-container"></div>

		<script src="JS/menu.js"></script>
		<script src="JS/footer.js"></script>

		<!-- Lógica general del menú y las interacciones del sitio -->
        <script src="JS/script.js"></script>
    </body>
