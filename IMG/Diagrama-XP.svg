<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
    <style>
        text { font-family: "Public Sans", Arial, sans-serif; text-anchor: middle; }
        .Fondo-Diagrama { fill: #fff; stroke: #d9cbb9; stroke-width: 1; }
        .Nodos-Scrum rect { fill: #e5def1; stroke: #e5def1; }
        .Nodos-Scrum text { fill: #171717; font-size: 17px; font-weight: 700; }
        .Flechas-Diagrama path { fill: none; stroke: #80649c; stroke-width: 2; }
        .Centro-Diagrama { fill: #80649c; font-size: 28px; font-weight: 800; }
        .Subcentro-Diagrama { fill: #171717; font-size: 16px; }
    </style>
    <defs>
        <marker id="flecha-xp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#80649c" stroke-width="1.5"/>
        </marker>
    </defs>
    <rect class="Fondo-Diagrama" x="1" y="1" width="758" height="328" rx="18"/>
    <g class="Nodos-Scrum">
        <rect x="42" y="32" width="160" height="56" rx="14"/><text x="122" y="67">Pruebas</text>
        <rect x="558" y="32" width="160" height="56" rx="14"/><text x="638" y="67">Código</text>
        <rect x="558" y="242" width="160" height="56" rx="14"/><text x="638" y="277">Refactorización</text>
        <rect x="42" y="242" width="160" height="56" rx="14"/><text x="122" y="277">Integración</text>
    </g>
    <g class="Flechas-Diagrama">
        <path d="M210 60 H545" marker-end="url(#flecha-xp)"/>
        <path d="M638 98 V225" marker-end="url(#flecha-xp)"/>
        <path d="M550 270 H215" marker-end="url(#flecha-xp)"/>
        <path d="M122 230 V103" marker-end="url(#flecha-xp)"/>
    </g>
    <text class="Centro-Diagrama" x="380" y="151">XP</text>
    <text class="Subcentro-Diagrama" x="380" y="181">Retroalimentación continua</text>
</svg>
